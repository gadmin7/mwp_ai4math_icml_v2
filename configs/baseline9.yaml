baseline_id: b9
base_model_id: meta-llama/Llama-3.2-1B-Instruct
model_tag: llama1b
hf_org: GT1999
push_to_hub: true
quantize: true
# Memory is dominated by the output logits (batch x seq x vocab), not the 1B of
# weights: Llama-3.2's 128,256-token vocab makes one logits tensor
# batch*1024*128256*4B -- 16.8GB at batch 32, which OOMs an 80GB card once you add
# its gradient and the activations. Batch 8 lands around 19GB total. Do not raise
# this without redoing that arithmetic. Override per-run with --batch-size.
batch_size: 8
seed: 42
